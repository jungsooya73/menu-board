<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✏️ 인터넷 창 맨 위(탭)에 보이는 이름이에요 -->
  <title>브릿지 커피 메뉴판</title>

  <script>
    /* ==========================================================
       📋 메뉴 정보 모음 (메뉴는 여기서만 고치면 돼요!)
       ==========================================================

       여기에 적힌 대로 화면에 메뉴 카드가 저절로 만들어져요.
       아래쪽 코드는 건드리지 않아도 돼요.

       ----------------------------------------------------------
       ▶ 생김새 알아보기
       ----------------------------------------------------------
       메뉴 하나는 이렇게 생긴 한 줄이에요.

         { 이름: "아메리카노", 가격: "4,500원", 설명: "산미가 적은 고소한 원두" },

       - 이름, 가격, 설명은 꼭 큰따옴표(" ") 안에 적어요.
       - 줄 맨 끝에는 쉼표(,)를 꼭 붙여요.

       ----------------------------------------------------------
       ▶ 1. 가격 고치기
       ----------------------------------------------------------
       따옴표 안의 숫자만 바꾸세요.
         바꾸기 전:  가격: "4,500원"
         바꾼 후:    가격: "4,800원"

       ----------------------------------------------------------
       ▶ 2. 메뉴 추가하기
       ----------------------------------------------------------
       ① 넣고 싶은 종류(커피/논커피/디저트)의 메뉴 줄 하나를 통째로 복사해요.
          ({ 부터 }, 까지 한 줄 전체)
       ② 바로 아래 줄에 붙여넣어요.
       ③ 따옴표 안의 이름, 가격, 설명만 새 메뉴로 바꿔요.
       예) 커피에 "카푸치노"를 넣고 싶으면 커피 메뉴들 사이에
         { 이름: "카푸치노", 가격: "5,000원", 설명: "풍성한 우유 거품" },

       ----------------------------------------------------------
       ▶ 3. 메뉴 빼기
       ----------------------------------------------------------
       빼고 싶은 메뉴 한 줄({ 부터 }, 까지)을 통째로 지우세요.

       ----------------------------------------------------------
       ▶ 4. 메뉴 순서 바꾸기
       ----------------------------------------------------------
       화면에는 여기 적힌 순서대로 나와요.
       메뉴 한 줄을 잘라내서(Ctrl+X) 원하는 자리에 붙여넣으세요(Ctrl+V).

       ----------------------------------------------------------
       ▶ 5. "대표" 표시 붙이기 / 떼기
       ----------------------------------------------------------
       붙이기: 줄 끝의 } 바로 앞에  , 대표: true  를 적어요.
         { 이름: "콜드브루", 가격: "5,300원", 설명: "...", 대표: true },
       떼기: , 대표: true 부분을 지우면 돼요.

       ----------------------------------------------------------
       ▶ 6. 새 종류 만들기 (예: "음료", "빵")
       ----------------------------------------------------------
       아래 [디저트] 덩어리 전체(종류: 부터 맨 끝 }, 까지)를 복사해서
       바로 아래에 붙여넣고, 종류 이름과 메뉴들을 바꾸세요.
       맨 위 종류 버튼도 저절로 하나 더 생겨요.

       ----------------------------------------------------------
       ⚠️ 메뉴판이 갑자기 안 나오면? 자주 하는 실수 3가지
       ----------------------------------------------------------
       ① 따옴표(")를 하나 빠뜨렸어요.   "아메리카노  ← 끝 따옴표 없음
       ② 줄 끝 쉼표(,)를 빠뜨렸어요.    ...원두" }   ← 끝에 , 없음
       ③ 괄호 { } [ ] 를 실수로 지웠어요.
       고친 곳을 다시 살펴보면 대부분 금방 찾을 수 있어요.
       ========================================================== */

    const 메뉴정보 = [

      /* ---------- [커피] ---------- */
      {
        종류: "커피",
        메뉴들: [
          { 이름: "아메리카노", 가격: "4,500원", 설명: "산미가 적은 고소한 원두" },
          { 이름: "카페라떼", 가격: "5,000원", 설명: "부드러운 우유 거품" },
          { 이름: "바닐라 라떼", 가격: "5,500원", 설명: "바닐라빈을 직접 우려낸 시럽" },
          { 이름: "카라멜마끼아또", 가격: "5,500원", 설명: "고퀄리티 마끼아또 시럽" },
          { 이름: "아인슈페너", 가격: "5,800원", 설명: "단맛을 줄인 수제 크림", 대표: true },
          { 이름: "콜드브루", 가격: "5,300원", 설명: "12시간 저온 추출, 목넘김이 깔끔함" },
          { 이름: "디카페인 아메리카노", 가격: "5,000원", 설명: "카페인 걱정 없이 편하게" },
        ]
      },

      /* ---------- [논커피] ---------- */
      {
        종류: "논커피",
        메뉴들: [
          { 이름: "흑임자 라떼", 가격: "5,500원", 설명: "국산 흑임자를 직접 갈아 넣음", 대표: true },
          { 이름: "말차 라떼", 가격: "5,800원", 설명: "우지 말차, 쌉쌀한 맛이 진함" },
          { 이름: "쑥 라떼", 가격: "5,500원", 설명: "강화도 쑥, 은은하고 담백함" },
          { 이름: "곡물 라떼", 가격: "5,300원", 설명: "볶은 곡물의 구수한 맛" },
          { 이름: "자몽에이드", 가격: "6,000원", 설명: "생과일 자몽 과육을 그대로" },
        ]
      },

      /* ---------- [디저트] ---------- */
      {
        종류: "디저트",
        메뉴들: [
          { 이름: "치즈케이크", 가격: "6,500원", 설명: "굽지 않은 부드러운 식감" },
          { 이름: "당근케이크", 가격: "6,000원", 설명: "견과류를 넉넉히 넣음" },
          { 이름: "스콘", 가격: "4,000원", 설명: "겉은 바삭 속은 촉촉, 잼과 함께" },
          { 이름: "바스크 치즈케이크", 가격: "6,800원", 설명: "겉면을 진하게 태운 풍미" },
        ]
      },

    ];
    /* ============ 📋 메뉴 정보 모음 끝 ============ */
  </script>

  <!-- 고운 돋움 글꼴을 인터넷에서 불러와요 (지우지 마세요) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       🎨 색깔 바꾸는 곳
       아래 # 뒤의 글자를 바꾸면 메뉴판 전체 색이 바뀌어요.
       ===================================================== */
    :root {
      --배경색: #4A3728;      /* 짙은 갈색 - 화면 배경 */
      --크림색: #F5EFE6;      /* 크림색 - 카드와 글자 */
      --강조색: #C9A27E;      /* 연한 커피색 - 버튼, 종류 제목 */
      --가격색: #E6C9A8;      /* 밝은 커피색 - 가격 (눈에 잘 띄게) */

      /* 배경 그라데이션: 위쪽 색 → 가운데 색 → 아래쪽 색 */
      --배경위: #5E4835;
      --배경아래: #2F2219;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;   /* 종류 버튼을 누르면 부드럽게 이동 */
      -webkit-text-size-adjust: 100%;   /* 아이폰을 가로로 돌려도 글자가 갑자기 커지지 않게 */
      text-size-adjust: 100%;
    }

    body {
      /* 고운 돋움이 없으면 맑은 고딕을 써요 */
      font-family: 'Gowun Dodum', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: var(--배경색);
      color: var(--크림색);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;   /* 버튼을 누를 때 생기는 회색 네모 없애기 */
    }

    /* 은은한 갈색 그라데이션 배경 (화면을 내려도 그대로 있어요) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(170deg, var(--배경위) 0%, var(--배경색) 45%, var(--배경아래) 100%);
    }

    /* 배경에 은은하게 번지는 빛 (유리 느낌을 살려줘요) */
    .배경빛 {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      z-index: -1;
    }
    .배경빛.하나 {
      width: 260px; height: 260px;
      background: #8B6A4F;
      top: -60px; left: -80px;
    }
    .배경빛.둘 {
      width: 300px; height: 300px;
      background: #A07E5E;
      bottom: -80px; right: -100px;
    }

    /* 화면 전체를 감싸는 상자 (휴대폰 폭에 맞춤) */
    .메뉴판 {
      max-width: 430px;
      margin: 0 auto;
      padding: 56px 22px 56px;
    }

    /* ---------- 1. 맨 위: 가게 이름 ---------- */
    .가게머리 {
      text-align: center;
      margin-bottom: 32px;
    }
    .가게이름 {
      font-size: 34px;
      font-weight: normal;
      letter-spacing: 2px;
    }
    .가게소개 {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.8;
    }
    .구분선 {
      width: 40px;
      height: 1px;
      background: var(--강조색);
      margin: 20px auto 0;
    }

    /* ---------- 종류 버튼 (커피/논커피/디저트) ---------- */
    .종류버튼줄 {
      position: sticky;          /* 내려도 화면 위에 붙어 있어요 */
      top: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
      padding: 6px;
      margin-bottom: 8px;
      background: rgba(74, 55, 40, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 239, 230, 0.18);
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    .종류버튼 {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;          /* 손가락으로 누르기 편한 높이 */
      border-radius: 999px;
      color: var(--크림색);
      text-decoration: none;
      font-size: 16px;
      background: rgba(245, 239, 230, 0.1);
    }
    .종류버튼:active,
    .종류버튼.지금 {             /* 지금 보고 있는 종류는 버튼 색이 바뀌어요 */
      background: var(--강조색);
      color: var(--배경색);
    }

    /* ---------- 2. 가운데: 메뉴 카드 ---------- */
    .종류묶음 {
      scroll-margin-top: 84px;   /* 버튼으로 이동할 때 제목이 가려지지 않게 */
    }
    .종류제목 {
      font-size: 21px;
      font-weight: normal;
      margin: 40px 6px 14px;
      color: var(--강조색);
      letter-spacing: 1px;
    }
    .메뉴목록 {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .카드 {
      /* 반투명 크림색 유리 (왼쪽 위가 살짝 더 밝아요) */
      background: linear-gradient(145deg, rgba(245, 239, 230, 0.17), rgba(245, 239, 230, 0.07));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 239, 230, 0.22);
      border-radius: 24px;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.16),          /* 부드러운 그림자 */
        inset 0 1px 0 rgba(255, 255, 255, 0.12);  /* 위쪽 가장자리의 얇은 빛 */
      padding: 22px 22px;
    }
    .메뉴윗줄 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .메뉴이름 {
      font-size: 19px;
      min-width: 0;
      word-break: keep-all;       /* "카라멜마끼아/또"처럼 이름 중간이 끊기지 않게 */
      overflow-wrap: anywhere;    /* 그래도 너무 길면 화면 밖으로 넘치지 않게 */
    }
    .대표표시 {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 9px;
      border-radius: 999px;
      border: 1px solid var(--강조색);
      color: var(--강조색);
      font-size: 13px;
      vertical-align: middle;
    }
    .가격 {
      font-size: 18px;
      font-weight: bold;
      color: var(--가격색);
      white-space: nowrap;
    }
    .메뉴설명 {
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.75;
    }
    .오류안내 {
      text-align: center;
      font-size: 15px;
    }

    /* ---------- 3. 맨 아래: 영업시간 + 전화 ---------- */
    .가게정보 {
      margin-top: 48px;
      text-align: center;
      padding: 28px 22px;
    }
    .정보제목 {
      font-size: 18px;
      font-weight: normal;
      margin-bottom: 12px;
    }
    .영업시간 {
      font-size: 15px;
      line-height: 1.9;
      opacity: 0.85;
      list-style: none;
    }
    .전화버튼 {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;          /* 손가락으로 누르기 편한 높이 */
      margin-top: 24px;
      border-radius: 18px;
      background: var(--강조색);
      color: var(--배경색);
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }
    .전화버튼:active {
      transform: scale(0.98);
    }

    /* ---------- 아주 좁은 휴대폰 (접는 폰 등, 가로 340px 이하) ---------- */
    @media (max-width: 340px) {
      .메뉴판 { padding-left: 16px; padding-right: 16px; }
      .카드 { padding: 18px 16px; }
      .메뉴이름 { font-size: 17px; }
      .가격 { font-size: 17px; }
      .종류버튼 { font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="배경빛 하나"></div>
  <div class="배경빛 둘"></div>

  <main class="메뉴판">

    <!-- =====================================================
         1. 맨 위: 가게 이름과 한 줄 소개
         ✏️ 아래 글자를 바꾸면 화면 맨 위 글자가 바뀌어요.
         ===================================================== -->
    <header class="가게머리">
      <h1 class="가게이름">브릿지 커피</h1>
      <p class="가게소개">매일 직접 볶는 스페셜티 커피</p>
      <div class="구분선"></div>
    </header>

    <!-- 종류 버튼 자리 (메뉴 정보 모음을 보고 저절로 채워져요. 고치지 마세요) -->
    <nav class="종류버튼줄" id="종류버튼줄"></nav>

    <!-- =====================================================
         2. 가운데: 메뉴 목록
         여기는 비어 있는 게 맞아요!
         파일 맨 위 "📋 메뉴 정보 모음"을 보고 메뉴가 저절로 채워져요.
         메뉴를 고치려면 파일 맨 위로 가세요.
         ===================================================== -->
    <section id="메뉴자리"></section>

    <!-- =====================================================
         3. 맨 아래: 영업시간과 전화 걸기 버튼
         ===================================================== -->
    <footer class="가게정보 카드">
      <h2 class="정보제목">영업시간</h2>

      <!-- ✏️ 영업시간: 줄을 바꾸거나 한 줄(<li>...</li>)을 더 넣어도 돼요 -->
      <ul class="영업시간">
        <li>평일 08:00 - 21:00</li>
        <li>주말 10:00 - 20:00</li>
        <li>목요일 휴무</li>
      </ul>

      <!-- ✏️ 전화번호: tel: 뒤의 번호를 바꾸면 버튼을 눌렀을 때 거는 번호가 바뀌어요.
           (- 없이 숫자만 써도 되고, - 를 넣어도 돼요) -->
      <a class="전화버튼" href="tel:062-000-0000">📞 전화 걸기</a>
    </footer>

  </main>

  <script>
    /* ==========================================================
       ⚙️ 메뉴 카드를 만들어 주는 부분
       파일 맨 위 "메뉴 정보 모음"을 읽어서 화면에 카드를 그려요.
       메뉴를 고칠 때는 여기를 건드릴 필요가 없어요.
       ========================================================== */
    const 메뉴자리 = document.getElementById('메뉴자리');
    const 종류버튼줄 = document.getElementById('종류버튼줄');

    // 작은 상자 하나를 만드는 도우미
    function 상자만들기(태그, 이름표, 글자) {
      const 상자 = document.createElement(태그);
      if (이름표) 상자.className = 이름표;
      if (글자) 상자.textContent = 글자;
      return 상자;
    }

    if (typeof 메뉴정보 === 'undefined') {
      // 메뉴 정보 모음에 오타가 있으면 손님 화면에 이 안내가 나와요
      메뉴자리.appendChild(상자만들기('p', '카드 오류안내',
        '메뉴를 불러오지 못했어요. 파일 맨 위 메뉴 정보 모음에서 따옴표(")와 쉼표(,)를 확인해 주세요.'));
      종류버튼줄.style.display = 'none';
    } else {
      메뉴정보.forEach(function (묶음, 순번) {
        const 묶음번호 = '종류-' + 순번;

        // 맨 위 종류 버튼
        const 버튼 = 상자만들기('a', '종류버튼', 묶음.종류);
        버튼.href = '#' + 묶음번호;
        종류버튼줄.appendChild(버튼);

        // 종류 제목 + 메뉴 카드들
        const 묶음상자 = 상자만들기('div', '종류묶음');
        묶음상자.id = 묶음번호;
        묶음상자.appendChild(상자만들기('h2', '종류제목', 묶음.종류));

        const 목록 = 상자만들기('div', '메뉴목록');
        묶음.메뉴들.forEach(function (메뉴) {
          const 카드 = 상자만들기('div', '카드');
          const 윗줄 = 상자만들기('div', '메뉴윗줄');

          const 이름칸 = 상자만들기('span', '메뉴이름', 메뉴.이름);
          if (메뉴.대표) 이름칸.appendChild(상자만들기('span', '대표표시', '대표'));

          윗줄.appendChild(이름칸);
          윗줄.appendChild(상자만들기('span', '가격', 메뉴.가격));
          카드.appendChild(윗줄);
          if (메뉴.설명) 카드.appendChild(상자만들기('p', '메뉴설명', 메뉴.설명));

          목록.appendChild(카드);
        });

        묶음상자.appendChild(목록);
        메뉴자리.appendChild(묶음상자);

        // 종류 버튼을 누르면 그 종류로 이동해요.
        // (휴대폰 '뒤로 가기'를 눌렀을 때 메뉴판에서 헤매지 않게 주소는 그대로 둬요)
        버튼.addEventListener('click', function (e) {
          e.preventDefault();
          묶음상자.scrollIntoView({ behavior: 'smooth' });
        });
      });

      // 화면을 내릴 때, 지금 보고 있는 종류의 버튼에 색을 칠해요
      const 모든버튼 = 종류버튼줄.querySelectorAll('.종류버튼');
      const 모든묶음 = 메뉴자리.querySelectorAll('.종류묶음');
      function 지금종류표시() {
        let 지금 = 0;
        모든묶음.forEach(function (묶음, 순번) {
          if (묶음.getBoundingClientRect().top <= 120) 지금 = 순번;
        });
        // 맨 아래까지 내렸으면 마지막 종류를 표시해요
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
          지금 = 모든묶음.length - 1;
        }
        모든버튼.forEach(function (버튼, 순번) {
          버튼.classList.toggle('지금', 순번 === 지금);
        });
      }
      window.addEventListener('scroll', 지금종류표시, { passive: true });
      지금종류표시();
    }

    // 아이폰에서 버튼을 누를 때 색이 바뀌는 효과가 보이게 해줘요
    document.addEventListener('touchstart', function () {}, { passive: true });
  </script>

</body>
</html>
